name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4']
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: openssl, fileinfo, pdo, json, zip
          coverage: none

      - name: Validate composer.json
        run: composer validate --strict --no-check-publish

      - name: PHP syntax check
        run: find src config tests demos examples bin -type f \( -name "*.php" -o -name "mnb-secure" \) -print0 | xargs -0 -n1 php -l

      - name: Run tests
        run: php tests/run-tests.php

      - name: Run demos
        run: php demos/run-all-demos.php
